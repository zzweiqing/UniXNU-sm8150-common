board_dependencies = ["display integration", "shader cache"]
verified_devices = ["nabu"]
dependencies = ["NabuAdreno", "AdrenoPM4"]
source_files = ["NativeAdrenoMetalPlugin.mm", "NativeAdrenoSystemFormatPolicy.h", "NativeBridgeMetalFrontend.mm", "bridge/NativeMetalBridge.rs", "bridge/NativeMetalObjects.rs", "bridge/NativeMetalObjects.h"]
runtime_identifiers = ["NativeMetal", "NativeAdrenoMetalPlugin.mm", "NativeAdrenoMetal.bundle", "NativeAdrenoMetal", "libvulkan_freedreno.dylib"]
build_stage = "payload"
build = []
outputs = ["build/adreno-metal-plugin/NativeAdrenoMetal.bundle"]

